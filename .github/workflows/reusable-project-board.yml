# Reusable Project Board Automation Workflow
# Synchronizes issues, pull requests, and status lifecycle across the
# Gray-Ghost-Data-Consultants-LLC Organization Project Board.
#
# Usage in any repository (.github/workflows/project-sync.yml). The canonical
# caller is workflow-templates/project-sync.yml -- copy that file, do not
# hand-roll one. Its trimmed trigger list matters: every extra event type
# (labeled, assigned, review_requested, ...) is a billed run that does nothing
# the board needs.
#
#   name: Sync to Project Board
#   on:
#     issues:
#       types: [opened, closed]
#     pull_request:
#       types: [opened, closed, ready_for_review]
#
#   concurrency:
#     group: project-sync-${{ github.event.issue.number || github.event.pull_request.number }}
#     cancel-in-progress: false
#
#   permissions:
#     contents: read
#
#   jobs:
#     sync-project:
#       if: ${{ !endsWith(github.actor, '[bot]') }}
#       uses: Gray-Ghost-Data-Consultants-LLC/.github/.github/workflows/reusable-project-board.yml@main
#       permissions:
#         contents: read
#         issues: write
#         pull-requests: write
#       secrets:
#         PROJECT_TOKEN: ${{ secrets.ORG_PROJECT_TOKEN || secrets.GITHUB_TOKEN }}
#
# The caller job cannot carry timeout-minutes (not allowed on a `uses:` job);
# the timeout lives on the job below.

name: Reusable Project Board Sync

on:
  workflow_call:
    inputs:
      org-name:
        description: "GitHub organization name owning the Project (v2)"
        type: string
        default: "Gray-Ghost-Data-Consultants-LLC"
      project-title:
        description: >-
          Title of the Organization Project (v2) to sync to. This is the BOARD OF
          RECORD and is resolved at RUN TIME; it takes precedence over
          project-number. Board numbers are not stable across this estate's
          history -- #5 was created on 2026-09-22 while all 30 callers still
          passed 1 -- so never rely on the number alone. Pass "" to opt out and
          use project-number instead.
        type: string
        default: "GGDC Master Engineering Board"
      project-number:
        description: "Organization Project (v2) number"
        type: number
        default: 1
      auto-label:
        description: "Automatically apply universal taxonomy labels if missing"
        type: boolean
        default: true
      include-bots:
        description: >-
          Sync items whose triggering actor is a bot (login ending in "[bot]").
          Default false: bot events are skipped. Bot-triggered pull_request runs
          get no secrets, so they could never reach the org board anyway -- they
          only burned a runner. A human closing or merging a bot PR is a human
          actor and still syncs.
        type: boolean
        default: false
      sync-all-actions:
        description: >-
          Run for every event action the caller forwards. Default false: only
          issues opened/closed/reopened, pull requests opened/closed/reopened/
          ready_for_review, and workflow_dispatch start the job. Anything else
          (labeled, assigned, review_requested, synchronize, ...) is skipped at
          the job level, so it never starts a runner. Set true only if the board
          must follow status:* labels as they are added.
        type: boolean
        default: false
    secrets:
      PROJECT_TOKEN:
        description: "Personal Access Token or GitHub App token with project:write permissions"
        required: false

# Least privilege. repository-projects was dropped: it governs classic repo
# projects only. The org Projects v2 board is reached with PROJECT_TOKEN, never
# with GITHUB_TOKEN. Dropping a scope is safe for callers that still grant it.
permissions:
  contents: read

jobs:
  sync-to-project:
    name: Sync Issue / PR to Org Project
    # Two gates, both evaluated before any runner starts, so a skipped event
    # bills nothing and the caller's run ends skipped, not failed:
    #  1. actor: bots are skipped unless include-bots.
    #  2. action: only the actions the board needs, unless sync-all-actions.
    #     This makes untrimmed callers (labeled, assigned, review_requested...)
    #     free no-ops without editing all 30 of them. `reopened` is kept: the
    #     step below maps it back to In Progress, and it is rare.
    if: >-
      ${{
        (inputs.include-bots || !endsWith(github.actor, '[bot]'))
        && (
          inputs.sync-all-actions
          || github.event_name == 'workflow_dispatch'
          || (github.event_name == 'issues'
              && contains(fromJSON('["opened","closed","reopened"]'), github.event.action))
          || ((github.event_name == 'pull_request' || github.event_name == 'pull_request_target')
              && contains(fromJSON('["opened","closed","reopened","ready_for_review"]'), github.event.action))
        )
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write         # auto-label on issues
      pull-requests: write  # auto-label on pull requests

    steps:
      - name: Auto-Label Universal Taxonomy
        if: ${{ inputs.auto-label }}
        uses: actions/github-script@v7
        with:
          script: |
            const isIssue = Boolean(context.payload.issue);
            const isPR = Boolean(context.payload.pull_request);
            const target = isIssue ? context.payload.issue : context.payload.pull_request;
            if (!target) return;

            const existingLabels = (target.labels || []).map(l => (typeof l === 'string' ? l : l.name));
            const labelsToAdd = new Set();

            const title = (target.title || '').toLowerCase();
            const body = (target.body || '').toLowerCase();
            const text = `${title} ${body}`;

            // Priority Auto-detection
            if (!existingLabels.some(l => l.startsWith('priority:'))) {
              if (text.includes('critical') || text.includes('fatal') || text.includes('outage') || text.includes('security breach')) {
                labelsToAdd.add('priority:critical');
              } else if (text.includes('urgent') || text.includes('blocker') || text.includes('high priority')) {
                labelsToAdd.add('priority:high');
              } else if (text.includes('minor') || text.includes('cosmetic') || text.includes('nice to have')) {
                labelsToAdd.add('priority:low');
              } else {
                labelsToAdd.add('priority:medium');
              }
            }

            // Type Auto-detection
            if (!existingLabels.some(l => l.startsWith('type:'))) {
              if (text.includes('bug') || text.includes('fix') || text.includes('error') || text.includes('broken')) {
                labelsToAdd.add('type:bug');
              } else if (text.includes('feature') || text.includes('enhancement') || text.includes('add')) {
                labelsToAdd.add('type:feature');
              } else if (text.includes('doc') || text.includes('readme') || text.includes('guide')) {
                labelsToAdd.add('type:docs');
              } else if (text.includes('security') || text.includes('vulnerability') || text.includes('cve')) {
                labelsToAdd.add('type:security');
              } else if (text.includes('refactor') || text.includes('cleanup')) {
                labelsToAdd.add('type:refactor');
              } else if (text.includes('test') || text.includes('coverage') || text.includes('spec')) {
                labelsToAdd.add('type:test');
              } else if (text.includes('perf') || text.includes('speed') || text.includes('latency')) {
                labelsToAdd.add('type:performance');
              } else {
                labelsToAdd.add('type:chore');
              }
            }

            // Status Auto-detection for opened events
            if (context.payload.action === 'opened') {
              if (!existingLabels.some(l => l.startsWith('status:'))) {
                if (isPR) {
                  labelsToAdd.add('status:review-needed');
                } else {
                  labelsToAdd.add('status:needs-triage');
                }
              }
            } else if (context.payload.action === 'closed') {
              labelsToAdd.add('status:done');
            } else if (context.payload.action === 'reopened') {
              labelsToAdd.add('status:in-progress');
            }

            if (labelsToAdd.size > 0) {
              const num = target.number;
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: num,
                labels: Array.from(labelsToAdd)
              });
              console.log(`✓ Added standard taxonomy labels to #${num}:`, Array.from(labelsToAdd));
            }

      - name: Add / Update Organization Project Board (GraphQL v2)
        uses: actions/github-script@v7
        env:
          ORG_NAME: ${{ inputs.org-name }}
          PROJECT_NUM: ${{ inputs.project-number }}
          PROJECT_TITLE: ${{ inputs.project-title }}
        with:
          # The org Projects v2 API needs a PAT/App token with project scope;
          # GITHUB_TOKEN cannot see org projects. Hand it to github-script so
          # the injected `github` client carries it — do NOT build a second
          # client in the script: github-script already injects a variable
          # named `octokit`, and `const octokit = …` threw
          # "Identifier 'octokit' has already been declared" on every run.
          github-token: ${{ secrets.PROJECT_TOKEN || github.token }}
          script: |
            const orgName = process.env.ORG_NAME;
            const fallbackNumber = parseInt(process.env.PROJECT_NUM, 10);
            const wantTitle = (process.env.PROJECT_TITLE || '').trim();
            let projectNumber = fallbackNumber;

            // --- Board of record: resolve by TITLE at run time -------------------
            // All 30 project-sync.yml callers pass `project-number: 1`, and #1 is
            // EMPTY. The board of record is "GGDC Master Engineering Board" (#5 as
            // of 2026-09-22) -- the only project in the org carrying hand-created
            // custom fields. Resolving here fixes every caller at once.
            //
            // Raising the project-number DEFAULT would have done nothing: callers
            // pass the value explicitly, so the default is never consulted.
            //
            // Uses the INJECTED `github` client, never a locally constructed one.
            // See fe43b1e: `const octokit = ...` collided with github-script's own
            // injected `octokit` and threw "Identifier 'octokit' has already been
            // declared" on every run. The token reaches `github` via github-token:.
            async function resolveByTitle(title) {
              if (!title) return null;
              const q = `
                query listOrgProjects($org: String!, $cursor: String) {
                  organization(login: $org) {
                    projectsV2(first: 100, after: $cursor) {
                      nodes { number title closed }
                      pageInfo { hasNextPage endCursor }
                    }
                  }
                }
              `;
              let cursor = null;
              const seen = [];
              for (let page = 0; page < 10; page++) {
                const res = await github.graphql(q, { org: orgName, cursor });
                const conn = res.organization && res.organization.projectsV2;
                if (!conn) return null;
                for (const n of conn.nodes) {
                  seen.push(`#${n.number} ${n.title}${n.closed ? ' (closed)' : ''}`);
                  if (!n.closed && n.title.trim().toLowerCase() === title.toLowerCase()) return n.number;
                }
                if (!conn.pageInfo.hasNextPage) break;
                cursor = conn.pageInfo.endCursor;
              }
              console.log(`No open project titled "${title}". Org projects seen: ${seen.join(' | ') || '(none)'}`);
              return null;
            }

            // Resolution failure must NOT fall back to the number. Callers pass 1,
            // and #1 is empty -- a rename, a revoked token or an API blip would
            // silently resume syncing to a dead board and report success.
            // ~/Business/CLAUDE.md: "resolve the board at run time and sync nothing
            // if no board matches." Skipping is the only behaviour that cannot
            // write to the wrong board.
            let resolveFailed = false;
            try {
              const resolved = await resolveByTitle(wantTitle);
              if (resolved === null) {
                resolveFailed = true;
                core.warning(`Board of record "${wantTitle}" did not resolve. NOT syncing -- refusing to fall back to project-number ${fallbackNumber}, which points at an empty board. If the board was renamed, update project-title; do not re-pin the number.`);
              } else {
                projectNumber = resolved;
                if (resolved !== fallbackNumber) {
                  console.log(`Board resolved by title: "${wantTitle}" is #${resolved}. Overriding the project-number ${fallbackNumber} this caller passed.`);
                } else {
                  console.log(`Board resolved by title: "${wantTitle}" is #${resolved} (matches the number passed).`);
                }
              }
            } catch (err) {
              resolveFailed = true;
              core.warning(`Board title resolution failed (${err.message}). NOT syncing -- refusing to fall back to project-number ${fallbackNumber}. A resolution error and "nothing to sync" must not look alike.`);
            }
            if (wantTitle && resolveFailed) return;
            // ---------------------------------------------------------------------

            const isIssue = Boolean(context.payload.issue);
            const isPR = Boolean(context.payload.pull_request);
            const target = isIssue ? context.payload.issue : context.payload.pull_request;
            if (!target) return;

            const targetNodeId = target.node_id;
            console.log(`Target: ${isIssue ? 'Issue' : 'PR'} #${target.number} (Node ID: ${targetNodeId})`);

            try {
              // 1. Fetch Org Project v2 ID
              const projectQuery = `
                query getOrgProject($org: String!, $number: Int!) {
                  organization(login: $org) {
                    projectV2(number: $number) {
                      id
                      title
                      fields(first: 20) {
                        nodes {
                          ... on ProjectV2SingleSelectField {
                            id
                            name
                            options {
                              id
                              name
                            }
                          }
                        }
                      }
                    }
                  }
                }
              `;

              const projectRes = await github.graphql(projectQuery, {
                org: orgName,
                number: projectNumber
              });

              const project = projectRes.organization && projectRes.organization.projectV2;
              if (!project) {
                console.log(`ℹ Project #${projectNumber} not found in org ${orgName}.`);
                return;
              }

              console.log(`✓ Located Project: "${project.title}" (ID: ${project.id})`);

              // 2. Add Item to Project v2
              const addItemMutation = `
                mutation addItem($projectId: ID!, $contentId: ID!) {
                  addProjectV2ItemById(input: { projectId: $projectId, contentId: $contentId }) {
                    item {
                      id
                    }
                  }
                }
              `;

              const addRes = await github.graphql(addItemMutation, {
                projectId: project.id,
                contentId: targetNodeId
              });

              const itemId = addRes.addProjectV2ItemById.item.id;
              console.log(`✓ Item added/synced to project board (Item ID: ${itemId})`);

              // 3. Status Field Mapping
              const statusField = project.fields.nodes.find(f => f.name && f.name.toLowerCase() === 'status');
              if (statusField && statusField.options) {
                let targetStatus = 'In Progress';
                const action = context.payload.action;

                if (action === 'closed') {
                  targetStatus = 'Done';
                } else if (action === 'reopened') {
                  targetStatus = 'In Progress';
                } else if (isPR && (action === 'opened' || action === 'ready_for_review' || action === 'review_requested')) {
                  targetStatus = 'Review Needed';
                } else {
                  const labels = (target.labels || []).map(l => (typeof l === 'string' ? l : l.name));
                  if (labels.includes('status:blocked')) targetStatus = 'Blocked';
                  else if (labels.includes('status:review-needed')) targetStatus = 'Review Needed';
                  else if (labels.includes('status:in-progress')) targetStatus = 'In Progress';
                  else if (labels.includes('status:needs-triage')) targetStatus = 'Needs Triage';
                  else if (labels.includes('status:done')) targetStatus = 'Done';
                }

                const matchedOption = statusField.options.find(
                  o => o.name.toLowerCase() === targetStatus.toLowerCase()
                );

                if (matchedOption) {
                  const updateFieldMutation = `
                    mutation updateFieldValue($projectId: ID!, $itemId: ID!, $fieldId: ID!, $optionId: String!) {
                      updateProjectV2ItemFieldValue(input: {
                        projectId: $projectId,
                        itemId: $itemId,
                        fieldId: $fieldId,
                        value: { singleSelectOptionId: $optionId }
                      }) {
                        projectV2Item {
                          id
                        }
                      }
                    }
                  `;

                  await github.graphql(updateFieldMutation, {
                    projectId: project.id,
                    itemId: itemId,
                    fieldId: statusField.id,
                    optionId: matchedOption.id
                  });

                  console.log(`✓ Project Board Status set to "${matchedOption.name}"`);
                }
              }
            } catch (err) {
              console.log(`ℹ Project board GraphQL operation notice: ${err.message}`);
            }
