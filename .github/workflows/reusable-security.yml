# Reusable Security Scan workflow
# Usage:
#   jobs:
#     security:
#       uses: Gray-Ghost-Data-Consultants-LLC/.github/.github/workflows/reusable-security.yml@main
#       with:
#         node-version: '20'
#         run-pip-audit: true   # for Python projects
#         run-gitleaks-cli: true # replaces a standalone gitleaks workflow
#       secrets: inherit
#
# Concurrency is handled here: a newer run on the same pull request cancels the
# older one; push and schedule runs are never queued or cancelled. The group is
# prefixed "reusable-security-" so it can never collide with the caller's own
# group (inside a called workflow, github.workflow is the CALLER's name).

name: Reusable Security Scan

on:
  workflow_call:
    inputs:
      node-version:
        description: "Node.js version to use"
        type: string
        default: "20"
      python-version:
        description: "Python version for pip-audit (empty = skip Python audit)"
        type: string
        default: "3.12"
      run-dependency-audit:
        description: "Run npm audit"
        type: boolean
        default: true
      run-secret-scan:
        description: "Run Gitleaks secret detection"
        type: boolean
        default: true
      run-sbom:
        description: "Generate SBOM (CycloneDX + SPDX)"
        type: boolean
        default: true
      run-license-check:
        description: "Run license compliance check"
        type: boolean
        default: true
      run-pip-audit:
        description: "Run pip-audit for Python dependency vulnerabilities"
        type: boolean
        default: false
      run-trivy-fs:
        description: "Run Trivy filesystem scan (IaC, misconfigurations, secrets)"
        type: boolean
        default: false
      audit-level:
        description: "npm audit severity level (low|moderate|high|critical)"
        type: string
        default: "moderate"
      allowed-licenses:
        description: "Semicolon-separated list of allowed SPDX license identifiers"
        type: string
        default: "MIT;Apache-2.0;BSD-2-Clause;BSD-3-Clause;ISC;0BSD;Unlicense;CC0-1.0;CC-BY-3.0;CC-BY-4.0;Python-2.0;Zlib"
      run-gitleaks-cli:
        description: >-
          Run the gitleaks CLI (pinned, checksum-verified binary, no license
          needed) over full git history. Lets a repo delete its standalone
          gitleaks workflow. Uses gitleaks-config when that file exists.
        type: boolean
        default: false
      gitleaks-config:
        description: "Path to the gitleaks config used by run-gitleaks-cli (ignored if the file is absent)"
        type: string
        default: ".gitleaks.toml"
      timeout-minutes:
        description: "timeout-minutes applied to every job"
        type: number
        default: 30
      concurrency-suffix:
        description: "Extra concurrency-group key; set only when one caller workflow invokes this workflow more than once"
        type: string
        default: ""
    secrets:
      GITLEAKS_LICENSE:
        required: false
      NPM_TOKEN:
        required: false

concurrency:
  group: reusable-security-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}${{ inputs.concurrency-suffix }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Default for any job that sets no permissions of its own. Jobs below only ever
# narrow what the caller grants; a called workflow cannot widen it.
permissions:
  contents: read

jobs:
  dependency-audit:
    name: Dependency Audit
    if: ${{ inputs.run-dependency-audit }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Run npm audit
        run: npm audit --omit=dev --audit-level=${{ inputs.audit-level }}
        continue-on-error: true

      - name: Generate audit report
        if: always()
        run: |
          npm audit --json > npm-audit.json || true
          echo "## NPM Audit Report" > audit-summary.md
          npm audit || true
        continue-on-error: true

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-report
          path: |
            npm-audit.json
            audit-summary.md
          if-no-files-found: ignore
          retention-days: 30

  pip-audit:
    name: Python Dependency Audit
    if: ${{ inputs.run-pip-audit }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Install project dependencies
        run: |
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f pyproject.toml ]; then pip install -e ".[dev]" 2>/dev/null || pip install -e .; fi

      - name: Run pip-audit
        run: pip-audit

  secret-scan:
    name: Secret Detection
    if: ${{ inputs.run-secret-scan }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

      - name: Upload Gitleaks report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: results.json
          if-no-files-found: ignore
          retention-days: 30

  gitleaks-cli:
    name: Secret Detection (gitleaks CLI)
    if: ${{ inputs.run-gitleaks-cli }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
    env:
      GITLEAKS_VERSION: "8.28.0"
      GITLEAKS_SHA256: "a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb"  # pragma: allowlist secret -- release checksum
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks (checksum verified)
        run: |
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$tarball" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          echo "${GITLEAKS_SHA256}  ${tarball}" | sha256sum -c -
          tar -xzf "$tarball" gitleaks
          ./gitleaks version

      - name: Run gitleaks over full history
        env:
          GITLEAKS_CONFIG_PATH: ${{ inputs.gitleaks-config }}
        run: |
          args=(git --redact --exit-code 1 --report-format sarif --report-path gitleaks-cli.sarif)
          if [ -n "$GITLEAKS_CONFIG_PATH" ] && [ -f "$GITLEAKS_CONFIG_PATH" ]; then
            args+=(--config "$GITLEAKS_CONFIG_PATH")
          fi
          ./gitleaks "${args[@]}" .

      - name: Upload gitleaks report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-cli-report
          path: gitleaks-cli.sarif
          if-no-files-found: ignore
          retention-days: 30

  trivy-fs:
    name: Trivy Filesystem Scan
    if: ${{ inputs.run-trivy-fs }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy FS scan
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "sarif"
          output: "trivy-fs-results.sarif"
          severity: "CRITICAL,HIGH"

      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        continue-on-error: true
        with:
          sarif_file: "trivy-fs-results.sarif"

  sbom:
    name: Generate SBOM
    if: ${{ inputs.run-sbom }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Generate SBOM (CycloneDX)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          format: cyclonedx-json
          output-file: sbom.cyclonedx.json

      - name: Generate SBOM (SPDX)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-reports
          path: |
            sbom.cyclonedx.json
            sbom.spdx.json
          retention-days: 90

  license-check:
    name: License Compliance
    if: ${{ inputs.run-license-check }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Check licenses
        run: |
          npm install -g license-checker
          license-checker \
            --production \
            --onlyAllow "${{ inputs.allowed-licenses }}" \
            --json > licenses.json
        continue-on-error: true

      - name: Upload license report
        uses: actions/upload-artifact@v4
        with:
          name: license-reports
          path: licenses.json
          if-no-files-found: ignore
          retention-days: 90
