# Structured-Project001 — CI workflow (Python)
# Copy to: Structured-Project001/.github/workflows/ci.yml
#
# WARNING: This repo has a self-hosted runner setup ([self-hosted, sp001-ci])
# with job-private venvs and no GitHub-side caches. Its existing ci-cd.yml
# triggers on push:develop only; deploy-gcp.yml owns push:main.
# Do NOT deploy this template without coordinating with the runners/infra team.
# Reference: Structured-Project001/docs/operations/RUNNERS.md, CI_PIPELINE_NOTES.md
name: CI

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main]
  workflow_call:

jobs:
  ci:
    uses: Gray-Ghost-Data-Consultants-LLC/.github/.github/workflows/reusable-ci.yml@main
    with:
      python-version: "3.12"
      run-python-lint: true
      run-python-test: true
      run-lint: false
      run-typecheck: false
      run-build: false
    secrets: inherit
