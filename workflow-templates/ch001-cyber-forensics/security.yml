# ch001-cyber-forensics — Security scan workflow (Python)
# Copy to: ch001-cyber-forensics/.github/workflows/security.yml
name: Security Scan

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  security:
    uses: Gray-Ghost-Data-Consultants-LLC/.github/.github/workflows/reusable-security.yml@main
    with:
      python-version: "3.12"
      run-pip-audit: true
      run-secret-scan: true
      run-sbom: true
      run-license-check: true
      run-trivy-fs: true
    secrets: inherit
