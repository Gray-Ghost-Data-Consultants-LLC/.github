# Snapps — Security scan workflow
# Copy to: Snapps/.github/workflows/security.yml
name: Security Scan

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  security:
    uses: Gray-Ghost-Data-Consultants-LLC/.github/.github/workflows/reusable-security.yml@main
    with:
      node-version: "20"
      run-dependency-audit: true
      run-secret-scan: true
      run-sbom: false
      run-license-check: false
      run-trivy-fs: true
    secrets: inherit
